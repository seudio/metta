<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFC27A"/>
      <stop offset="0.45" stop-color="#FF7A7A"/>
      <stop offset="1" stop-color="#9B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#FFF6E0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFF6E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE3EC"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5B1E6E" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7A1F4F" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS tile: 824px squircle-ish rounded rect with 100px margins -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <!-- little stars -->
  <g fill="#FFF8E7" opacity="0.9">
    <path d="M250 270 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/>
    <path d="M780 300 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
    <path d="M760 770 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z"/>
    <circle cx="300" cy="760" r="9"/>
    <circle cx="820" cy="560" r="7"/>
  </g>
  <circle cx="512" cy="500" r="330" fill="url(#glow)"/>
  <!-- enso: brush circle, open at the top right, thick to thin -->
  <g filter="url(#soft)">
    <path d="M 650 262
             C 560 205, 420 205, 330 282
             C 235 365, 222 515, 285 620
             C 352 732, 500 790, 630 742
             C 755 696, 818 570, 790 450
             C 776 392, 748 352, 716 322
             C 742 362, 760 410, 762 462
             C 768 570, 705 668, 610 702
             C 505 740, 382 700, 326 610
             C 270 518, 285 395, 366 322
             C 438 258, 548 245, 650 262 Z"
          fill="#FFFFFF"/>
  </g>
  <!-- heart -->
  <g filter="url(#soft)">
    <path d="M512 640
             C 470 606, 380 548, 380 470
             C 380 420, 418 386, 462 386
             C 488 386, 503 398, 512 414
             C 521 398, 536 386, 562 386
             C 606 386, 644 420, 644 470
             C 644 548, 554 606, 512 640 Z"
          fill="url(#heart)"/>
  </g>
  <!-- face -->
  <g fill="#5B2245">
    <ellipse cx="470" cy="478" rx="13" ry="16"/>
    <ellipse cx="554" cy="478" rx="13" ry="16"/>
  </g>
  <path d="M 490 520 Q 512 545 534 520" fill="none" stroke="#5B2245" stroke-width="10" stroke-linecap="round"/>
  <g fill="#FF7FA0" opacity="0.7">
    <ellipse cx="437" cy="512" rx="20" ry="12"/>
    <ellipse cx="587" cy="512" rx="20" ry="12"/>
  </g>
</svg>
